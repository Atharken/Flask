<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit transaction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

</head>
<body>
    <button id="theme-toggle" type="button">
    🌙 Dark mode
    </button>
    <form action = "/edit/{{index}}" method = "POST">
        
     
        <div class = "container">

            <label for = "name">name</label>
            <input id = "name" name = "name" type = "text" value = "{{transactions[index].name}}">
        </div>
        <div>
            <label for = "amount">amount</label>
            <input id = "amount" name = "amount" type = "number" step = "0.01" placeholder="enter amount" value = "{{transactions[index].amount}}"  >
        </div>
        <div>
            <label for = "category">category</label>
            <input id = "category" name = "category" type = "text" placeholder="enter category" value = "{{transactions[index].category}}" >
        </div>
        <div>
            <label for = "type">type</label>
            
            <select id="type" name = "type" >
                <option value="income" {% if transactions[index].type == 'income' %} selected {% endif %}>income</option>
                <option value="expense" {% if transactions[index].type == 'expense' %} selected {% endif %}>expense</option>
            </select> 
        </div>
        
        <br>
        
        <div>
            <button type = "submit">submit transaction</button>
        </div>
        {% if success == True %}
        <p>transaction succesfully saved</p>
        {% endif %}
    </form>
    <hr>
    <br>
    <br>
    <a href = "/transaction"><input type = "button" value = "back"></a>
</div>
    
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    
</body>
</html>
