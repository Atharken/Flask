<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <caption>transaction report</caption>
        <thead>
          <tr>
              <th>
                name
              </th>
              <th>
                amount
              </th>
              <th>
                category
              </th>
              <th>
                type
              </th>
          </tr>
        </thead>  
        <tbody>{% for i in transactions %}
                <tr>
                    <td>{{i.name}}</td>
                    <td>{{i.amount}}</td>
                    
                    <td>{{i.category}}</td>
                    <td>{{i.type}}</td>
                </tr>
                {%endfor%}
        </tbody>
    </table>
    <P>
        {% if balance > 0 %}
          remaining balance {{balance}}
        {% elif balance < 0 %}
          you are spending more than earning
        {% else %}
          invalid 
        {%endif%}
    </P>
</body>
</html>
